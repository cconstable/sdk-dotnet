name: Test Report
on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Test Report
        id: test-report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          artifact: /test-results-(.*)/
          name: Test Results ($1)
          path: '**/*.trx'
          reporter: dotnet-trx
          # Default writes to the actions job summary, which isn't visible
          # from the PR. Setting this to false makes dorny create a real
          # check run on the PR head SHA so it shows up in the PR's checks.
          use-actions-summary: 'false'

      - name: Upsert PR comment with test report link
        if: ${{ always() && github.event.workflow_run.pull_requests[0].number }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const marker = '<!-- test-report-comment -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.CI_HEAD_SHA;
            const body = [
              marker,
              `### Test report`,
              ``,
              `Test results for commit \`${headSha.slice(0, 7)}\`: [view test report run](${runUrl})`,
              ``,
              `_The detailed pass/fail breakdown is published as **Test Results (...)** check runs on this PR._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
